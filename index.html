<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Secure Pro Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Advanced Secret Instagram Mode */
        .insta-mode {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .insta-mode .app-header {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) !important;
        }
        .insta-mode .chat-area {
            background-color: #121212 !important;
        }
        .insta-mode .msg-me {
            background-color: #0095f6 !important;
            color: #ffffff !important;
        }
        .insta-mode .msg-other {
            background-color: #262626 !important;
            color: #ffffff !important;
        }
        /* Custom Scrollbar for Advanced Look */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header id="header-bar" class="app-header bg-[#075e54] text-white p-3.5 flex justify-between items-center shadow-md transition-all duration-300">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-800 flex items-center justify-center font-bold shadow-inner">
                <i data-lucide="user" class="w-5 h-5"></i>
            </div>
            <div>
                <!-- Secret Trigger: Tap 5 times -->
                <h1 id="title-text" onclick="triggerSecretTheme()" class="font-bold text-base cursor-pointer select-none tracking-wide">
                    Chats <span class="text-[9px] text-emerald-200 font-normal block md:inline">(Tap 5x for IG Mode)</span>
                </h1>
                <p id="user-tag" class="text-xs text-emerald-100 font-medium"></p>
            </div>
        </div>
        <div class="flex items-center gap-4 text-emerald-100">
            <i data-lucide="video" class="w-5 h-5 cursor-pointer hover:text-white transition-colors"></i>
            <i data-lucide="phone" class="w-5 h-5 cursor-pointer hover:text-white transition-colors"></i>
            <i data-lucide="more-vertical" class="w-5 h-5 cursor-pointer hover:text-white transition-colors"></i>
        </div>
    </header>

    <!-- Chat Messages Window -->
    <main id="chat-window" class="chat-area flex-1 overflow-y-auto p-4 space-y-3 bg-[#efeae2] transition-colors duration-300">
        <!-- Dynamic Messages Will Load Here -->
    </main>

    <!-- Controls / Paragraph Input Bar -->
    <footer id="control-bar" class="bg-[#f0f2f5] p-3 flex items-end gap-2 border-t border-gray-300 shadow-lg">
        <button onclick="document.getElementById('file-input').click()" class="text-gray-600 p-2.5 hover:bg-gray-200 rounded-full transition-colors mb-0.5" title="Attach Media">
            <i data-lucide="paperclip" class="w-5 h-5"></i>
        </button>
        <input type="file" id="file-input" accept="image/*,video/*" class="hidden" onchange="handleMediaUpload(event)">

        <!-- Textarea for Multi-line / Paragraph support -->
        <textarea id="msg-input" placeholder="Type a message (Paragraphs supported)..." rows="1" class="flex-1 bg-white border border-gray-300 px-4 py-2 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-[#00a884] shadow-sm transition-all resize-none max-h-32"></textarea>
        
        <button onclick="sendMessage()" class="bg-[#00a884] text-white p-2.5 rounded-full hover:bg-emerald-700 shadow-md transition-transform active:scale-95 flex items-center justify-center mb-0.5">
            <i data-lucide="send" class="w-5 h-5"></i>
        </button>
    </footer>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Constants & Configs
        const BIN_ID = "6addf3a8ffd5d160538a58e6";
        const API_KEY = "$2a$10$pI4R3W9UsoJ4ybW78fotNugUrCJDiysHmy/Spjr4rEhGcq4E7mHve";
        
        let tapCounter = 0;
        let myUser = localStorage.getItem('chat_user') || 'User_' + Math.floor(Math.random() * 9000 + 1000);
        localStorage.setItem('chat_user', myUser);
        document.getElementById('user-tag').innerText = 'Connected as: ' + myUser;

        // Auto-sync every 4 seconds
        loadChats();
        setInterval(loadChats, 4000);

        // Secret Theme Switcher
        function triggerSecretTheme() {
            tapCounter++;
            if (tapCounter >= 5) {
                document.body.classList.toggle('insta-mode');
                const isInsta = document.body.classList.contains('insta-mode');
                document.getElementById('title-text').innerHTML = isInsta ? 
                    'Instagram Direct <span class="text-[9px] text-pink-300 font-normal block md:inline">(IG Mode Active)</span>' : 
                    'Chats <span class="text-[9px] text-emerald-200 font-normal block md:inline">(Tap 5x for IG Mode)</span>';
                tapCounter = 0;
            }
        }

        // Fetch Messages from JSONBin
        async function loadChats() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (!response.ok) throw new Error("Network response failed");
                const data = await response.json();
                renderUI(data.record.messages || []);
            } catch (error) {
                console.error("Sync error:", error);
            }
        }

        // Render UI cleanly with Paragraph support (whitespace-pre-wrap)
        function renderUI(messages) {
            const win = document.getElementById('chat-window');
            const isAtBottom = win.scrollHeight - win.scrollTop <= win.clientHeight + 100;
            
            win.innerHTML = '';

            messages.forEach(m => {
                if (m.deletedFor && m.deletedFor.includes(myUser)) return;

                const isMe = m.sender === myUser;
                const box = document.createElement('div');
                box.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;

                let mediaHTML = '';
                if (m.mediaType === 'image') {
                    mediaHTML = `<img src="${m.media}" class="rounded-lg max-w-xs max-h-48 object-cover my-1 shadow-sm">`;
                } else if (m.mediaType === 'video') {
                    mediaHTML = `<video src="${m.media}" controls class="rounded-lg max-w-xs max-h-48 my-1 shadow-sm"></video>`;
                }

                box.innerHTML = `
                    <div class="${isMe ? 'msg-me bg-[#d9fdd3] text-gray-900' : 'msg-other bg-white text-gray-900'} px-3.5 py-2 rounded-xl shadow-sm max-w-xs md:max-w-md text-sm relative group transition-all">
                        <p class="text-[10px] font-bold text-gray-500 mb-0.5">${m.sender}</p>
                        ${m.text ? `<p class="break-words whitespace-pre-wrap leading-relaxed">${m.text}</p>` : ''}
                        ${mediaHTML}
                        <button onclick="softDelete('${m.id}')" class="text-[10px] text-red-500 mt-1 opacity-0 group-hover:opacity-100 transition-opacity block hover:underline font-medium">Delete for me</button>
                    </div>
                `;
                win.appendChild(box);
            });

            if (isAtBottom) {
                win.scrollTop = win.scrollHeight;
            }
        }

        // Push new message
        async function sendMessage(textVal = '', mediaVal = '', mediaTypeVal = '') {
            const input = document.getElementById('msg-input');
            const text = textVal || input.value.trim();
            if (!text && !mediaVal) return;

            if (!textVal) input.value = '';

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                const list = data.record.messages || [];

                list.push({
                    id: 'msg_' + Date.now() + Math.random().toString(36).substring(2, 7),
                    sender: myUser,
                    text: text,
                    media: mediaVal,
                    mediaType: mediaTypeVal,
                    deletedFor: []
                });

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ messages: list })
                });

                loadChats();
            } catch (error) {
                console.error("Failed to send message:", error);
            }
        }

        // Handle Image/Video Upload securely via Base64
        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const mediaType = file.type.startsWith('video') ? 'video' : 'image';
                sendMessage('', e.target.result, mediaType);
            };
            reader.readAsDataURL(file);
        }

        // Soft Delete Mechanism
        async function softDelete(msgId) {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                let list = data.record.messages || [];

                list = list.map(m => {
                    if (m.id === msgId) {
                        m.deletedFor = m.deletedFor || [];
                        if (!m.deletedFor.includes(myUser)) {
                            m.deletedFor.push(myUser);
                        }
                    }
                    return m;
                });

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ messages: list })
                });

                loadChats();
            } catch (error) {
                console.error("Delete failed:", error);
            }
        }
    </script>
</body>
</html>
